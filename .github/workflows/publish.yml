# Publishes the v0.1 release artifacts:
#   - kitecodec-core            → Maven Central (Central Portal, via the vanniktech plugin)
#   - kitecodec-gradle-plugin   → the Gradle Plugin Portal
#
# PREREQUISITES (all must exist before running this workflow):
#   Secrets:
#     MAVEN_CENTRAL_USERNAME / MAVEN_CENTRAL_PASSWORD: Central Portal user token
#     SIGNING_IN_MEMORY_KEY / SIGNING_IN_MEMORY_KEY_PASSWORD: ASCII-armored GPG key + passphrase
#     GRADLE_PUBLISH_KEY / GRADLE_PUBLISH_SECRET: Plugin Portal API key
#   Release assets:
#     The `ffmpeg-<version>` release (created by release-binaries.yml) must exist with the five
#     stable-target LGPL zips + .sha256 files:
#       ffmpeg-<version>-lgpl-{macos-arm64,linux-x64,android-arm64,android-arm32,android-x64}.zip
#
# VERSIONING: the library version is static in gradle.properties (VERSION=…). The tag is the
# trigger, not the source of truth: the check-version job asserts `v<VERSION>` == the pushed tag
# (or the workflow_dispatch input) and fails on mismatch, so a stale gradle.properties can never
# publish under the wrong tag.
#
# kitecodec-core publishes the v0.1 stable native target set plus the always-present JVM, JS and
# WasmJs variants (-Pkitecodec.stableTargetsOnly=true). JVM/JS/WasmJs are invariant unsupported
# placeholders; the JNI JVM harness in the local phone proof is a custom test compilation only.
# The publish guard in kitecodec-core/build.gradle.kts hard-fails if any configured native target
# is missing its FFmpeg tree, which is why the fetch step below must cover all five native triples.
name: Publish release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (must match VERSION in gradle.properties), e.g. 0.1.0"
        required: true

permissions:
  contents: read

env:
  # FFmpeg release tag whose prebuilt assets kitecodec-core compiles against. Keep in sync with
  # BuildFFmpegTask.DEFAULT_SOURCE_REF (buildSrc) and DEFAULT_FFMPEG_VERSION in
  # kitecodec-gradle-plugin/…/KiteCodecPlugin.kt. There is no single gradle.properties pin (yet).
  FFMPEG_VERSION: n8.0

jobs:
  check-version:
    name: tag matches gradle.properties
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Assert version match
        run: |
          gradle_version="$(grep '^VERSION=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            expected="${{ github.event.inputs.version }}"
          else
            expected="${GITHUB_REF_NAME#v}"
          fi
          if [ "${gradle_version}" != "${expected}" ]; then
            echo "::error::version mismatch: gradle.properties has VERSION=${gradle_version} but the release asked for ${expected}" >&2
            exit 1
          fi
          echo "Publishing version ${gradle_version}"

  publish-library:
    name: kitecodec-core → Maven Central
    needs: check-version
    # Apple klibs (macosArm64) can only be produced on a macOS host.
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-publish-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            konan-publish-
      # The publish guard requires an FFmpeg tree for EVERY stable target. Fetch this repo's own
      # prebuilt LGPL assets and unpack them into the exact layout FFmpegPaths.resolve() expects:
      # native-libs/<license>/<triple>/{include,lib} (the zips are rooted at {include,lib}).
      - name: Fetch prebuilt FFmpeg (5 stable triples, lgpl)
        run: |
          set -euo pipefail
          base="https://github.com/${{ github.repository }}/releases/download/ffmpeg-${FFMPEG_VERSION}"
          for triple in macos-arm64 linux-x64 android-arm64 android-arm32 android-x64; do
            asset="ffmpeg-${FFMPEG_VERSION}-lgpl-${triple}.zip"
            echo "fetching ${asset}"
            curl -fL --retry 3 -o "${asset}" "${base}/${asset}"
            curl -fL --retry 3 -o "${asset}.sha256" "${base}/${asset}.sha256"
            shasum -a 256 -c "${asset}.sha256"
            mkdir -p "native-libs/lgpl/${triple}"
            unzip -q "${asset}" -d "native-libs/lgpl/${triple}"
            test -f "native-libs/lgpl/${triple}/lib/libavformat.a"
            rm -f "${asset}" "${asset}.sha256"
          done
      # publishAllPublicationsToMavenCentralRepository uploads to the Central Portal but does NOT
      # auto-release (the build script calls publishToMavenCentral() without automatic release), so
      # the deployment is finished manually in the portal UI, which is the right amount of caution
      # for the first releases. Switch to publishAndReleaseToMavenCentral to automate later.
      - name: Publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
        run: |
          ./gradlew :kitecodec-core:publishAllPublicationsToMavenCentralRepository \
            -Pkitecodec.stableTargetsOnly=true \
            --no-configuration-cache \
            --stacktrace

  publish-plugin:
    name: kitecodec-gradle-plugin → Plugin Portal
    needs: check-version
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # com.gradle.plugin-publish reads GRADLE_PUBLISH_KEY / GRADLE_PUBLISH_SECRET from the
      # environment (its documented env-var form of gradle.publish.key / gradle.publish.secret).
      - name: Publish to the Gradle Plugin Portal
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        run: ./gradlew :kitecodec-gradle-plugin:publishPlugins --stacktrace
