# Builds + tests kitecodec-core and runs an end-to-end transcode on every desktop K/N target
# that can get an FFmpeg toolchain in CI:
#
#   - macOS arm64  → Homebrew FFmpeg (8.x), dynamic linking
#   - Linux x64    → Ubuntu apt FFmpeg (6.x) — also proves the lavc 6.x compat path in ffmpeg.def
#   - Windows x64  → BtbN mingw shared build dropped into native-libs/mingw-x64 (vendored path)
#
# Not covered (yet): iOS targets need a cross-compiled vendored FFmpeg (:buildFFmpegFor<Target>
# with the vendor/ffmpeg submodule); linuxArm64 needs an arm64 runner with K/N host support;
# macosX64 is deprecated by Kotlin 2.3.20.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-arm64:
    name: macOS arm64 (brew FFmpeg)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-macos-arm64-${{ hashFiles('gradle/libs.versions.toml') }}
      - name: Install FFmpeg
        run: brew install ffmpeg
      - name: Unit + native tests
        run: ./gradlew :kitecodec-core:macosArm64Test --stacktrace
      - name: Link sample
        run: ./gradlew :kitecodec-sample:linkDebugExecutableMacosArm64
      - name: End-to-end transcode
        run: scripts/e2e.sh kitecodec-sample/build/bin/macosArm64/debugExecutable/kitecodec-sample.kexe

  linux-x64:
    name: Linux x64 (apt FFmpeg)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-linux-x64-${{ hashFiles('gradle/libs.versions.toml') }}
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg \
            libavformat-dev libavcodec-dev libavfilter-dev \
            libavutil-dev libswscale-dev libswresample-dev
      - name: Unit + native tests
        run: ./gradlew :kitecodec-core:linuxX64Test --stacktrace
      - name: Link sample
        run: ./gradlew :kitecodec-sample:linkDebugExecutableLinuxX64
      - name: End-to-end transcode
        run: scripts/e2e.sh kitecodec-sample/build/bin/linuxX64/debugExecutable/kitecodec-sample.kexe

  android-arm64:
    name: Android arm64 (NDK FFmpeg, LGPL profile)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-android-arm64-${{ hashFiles('gradle/libs.versions.toml') }}
      # The NDK cross-compile of FFmpeg takes ~6 min — cache the resulting static libs and
      # only rebuild when the build-task definition (codec set, flags) changes.
      - uses: actions/cache@v4
        id: ffmpeg-android
        with:
          path: native-libs/android-arm64
          key: ffmpeg-android-arm64-n8.0-api24-${{ hashFiles('buildSrc/src/main/kotlin/BuildFFmpegTask.kt') }}
      - name: Build FFmpeg for Android (NDK)
        if: steps.ffmpeg-android.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch n8.0 https://github.com/FFmpeg/FFmpeg.git vendor/ffmpeg
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          ./gradlew :kitecodec-core:buildFFmpegForAndroidArm64 --stacktrace
      - name: Compile kitecodec-core klib (androidNativeArm64)
        run: ./gradlew :kitecodec-core:compileKotlinAndroidNativeArm64 --stacktrace

  windows-x64:
    name: Windows x64 (BtbN FFmpeg, mingw)
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-windows-x64-${{ hashFiles('gradle/libs.versions.toml') }}
      # The shared (DLL) mingw build carries include/ + lib/ import libraries — exactly the
      # layout FFmpegPaths expects under native-libs/<target>/. GPL variant so the e2e's
      # libx264 encode works; CI never redistributes the binaries.
      - name: Download FFmpeg (BtbN win64 gpl shared)
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl-shared.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-tmp
          $dir = Get-ChildItem ffmpeg-tmp -Directory | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path native-libs | Out-Null
          Move-Item $dir.FullName native-libs/mingw-x64
          Add-Content -Path $env:GITHUB_PATH -Value "${{ github.workspace }}\native-libs\mingw-x64\bin"
      - name: Unit + native tests
        run: ./gradlew :kitecodec-core:mingwX64Test --stacktrace
      - name: Link sample
        run: ./gradlew :kitecodec-sample:linkDebugExecutableMingwX64
      - name: End-to-end transcode
        run: scripts/e2e.sh kitecodec-sample/build/bin/mingwX64/debugExecutable/kitecodec-sample.exe ffmpeg ffprobe
