# Weekly dependency update PRs for the three ecosystems this repo pins:
#   - GitHub Actions used by .github/workflows/*
#   - Gradle dependencies (gradle/libs.versions.toml + build scripts)
#   - pip packages for the docs site (docs/requirements.txt)
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly

  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly

  - package-ecosystem: pip
    directory: "/docs"
    schedule:
      interval: weekly
