#Gradle
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.daemon=true
org.gradle.caching=true
org.gradle.configuration-cache=true

#Kotlin
kotlin.code.style=official
kotlin.mpp.stability.nowarn=true
kotlin.mpp.enableCInteropCommonization=true
kotlin.apple.xcodeCompatibility.nowarn=true

#Dokka (v2 generator, aggregated API site at build/dokka/html)
org.jetbrains.dokka.experimental.gradle.pluginMode=V2Enabled
org.jetbrains.dokka.experimental.gradle.pluginMode.noWarn=true

#Library coordinates
GROUP=io.github.yuroyami
VERSION=0.0.4
DESCRIPTION=KiteCodec: a coroutine-first Kotlin/Native API for video and audio: demux, decode, filter, encode, mux, transcode and remux, over FFmpeg's libav* libraries. Hardware encoding via VideoToolbox and MediaCodec is in the shipping profiles. Requires the KiteCodec Gradle plugin to supply the native FFmpeg binaries.

#FFmpeg paths, overridden by buildSrc per target. This is the macOS dev default.
kitecodec.macos.homebrew.prefix=/opt/homebrew


kotlin.native.ignoreDisabledTargets=true